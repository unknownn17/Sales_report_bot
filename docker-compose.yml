services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  bot:
    build:
      context: .
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-report_bot}
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:
